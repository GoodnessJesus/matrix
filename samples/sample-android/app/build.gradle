apply plugin: 'com.google.osdetector'

ext.removeUnusedResourcesV2Enable = true

import com.google.gson.Gson
import com.google.gson.JsonArray

import com.android.build.api.artifact.SingleArtifact

apply plugin: 'com.android.application'

configurations.all {
    // check for updates every build
    resolutionStrategy.cacheChangingModulesFor 0, 'seconds'
}

android {
    namespace = 'sample.tencent.matrix'
    compileSdk = 36
    buildToolsVersion = "37.0.0"

    signingConfigs {
        debug {
            storeFile file("./keystore/debug.keystore")
        }
        release {
            storeFile file("./keystore/debug.keystore")
        }
    }

    defaultConfig {
        applicationId = "sample.tencent.matrix"
        minSdk = 23
        targetSdk = 29
        versionCode = 1
        versionName = "1.0"
        testInstrumentationRunner = 'androidx.test.runner.AndroidJUnitRunner'

        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a'
        }
    }

    buildTypes {
        release {
            debuggable = false
            minifyEnabled = true
            signingConfig = signingConfigs.debug
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            debuggable = true
        }
    }

    packaging {
        jniLibs {
            pickFirsts += [
                    'lib/armeabi-v7a/libc++_shared.so',
                    'lib/arm64-v8a/libc++_shared.so',
                    'lib/armeabi-v7a/libwechatbacktrace.so',
                    'lib/arm64-v8a/libwechatbacktrace.so'
            ]
        }
    }

    // Encapsulates your external native build configurations.
    externalNativeBuild {

        // Encapsulates your CMake build configurations.
        cmake {

            // Provides a relative path to your CMake build script.
            path "CMakeLists.txt"
        }
    }

    sourceSets {
        main {
            jniLibs {
                setSrcDirs (['./libs'] as Set)
            }
        }

    }

}

if (!removeUnusedResourcesV2Enable) {
    androidComponents.onVariants(androidComponents.selector().withBuildType('debug')) { variant ->
        def rTxt = variant.artifacts.get(SingleArtifact.RUNTIME_SYMBOL_LIST.INSTANCE)
        tasks.matching { it.name == "package${variant.name.capitalize()}" }.configureEach {
            doLast {
                def apk = outputs.files.asFileTree.matching { include '**/*.apk' }.singleFile
                def checker = file(matrix.removeUnusedResources.apkCheckerPath)
                def process = new ProcessBuilder('java', '-jar', checker.absolutePath,
                        '--apk', apk.absolutePath,
                        '--output', "${projectDir}/unused_resources",
                        '--format', 'json', '-unusedResources', '--rTxt', rTxt.get().asFile.absolutePath).start()
                process.waitFor()
                println process.inputStream.text
                println process.errorStream.text
                def outputFile = projectDir.toPath().resolve('unused_resources.json').toFile()
                if (outputFile.exists()) {
                    JsonArray jsonArray = new Gson().fromJson(outputFile.text, JsonArray)
                    jsonArray.each { item ->
                        if (item.asJsonObject.get('taskType').asInt == 12) {
                            item.asJsonObject.get('unused-resources').asJsonArray.each {
                                project.ext.unusedResourcesSet.add(it.asString)
                            }
                        }
                    }
                    println "find unused resources:\n${unusedResourcesSet}"
                    outputFile.delete()
                }
            }
        }
    }
}

configurations {
    apkCheckerDependency {
        canBeConsumed = false
        canBeResolved = true
    }
    sevenZipDependency {
        canBeConsumed = false
        canBeResolved = true
    }
}

if (rootProject.ext.useLocalMaven()) {
    apply from: project.file('dependencies-src.gradle')
} else {
    apply from: project.file('dependencies-aar.gradle')
}

if (!removeUnusedResourcesV2Enable) {
    project.ext.unusedResourcesSet = new HashSet<String>()
}

apply plugin: 'com.tencent.matrix-plugin'
matrix {

    logLevel = "D"

    trace {
        enable = true
        baseMethodMapFile = "${project.projectDir}/matrixTrace/methodMapping.txt"
        blackListFile = "${project.projectDir}/matrixTrace/blackMethodList.txt"
    }
    removeUnusedResources {
        variant = "debug"

        v2 = removeUnusedResourcesV2Enable

        if (!v2) {
            unusedResources = project.ext.unusedResourcesSet
        }

        enable = true
        needSign = true
        shrinkArsc = true
        shrinkDuplicates = true
        use7zip = false
        zipAlign = true
        embedResGuard = true

        apkCheckerPath = "${project.configurations.apkCheckerDependency.resolve().find { it.name.startsWith("matrix-apk-canary") }.getAbsolutePath()}"
        def isWindows = System.getProperty('os.name').toLowerCase().contains('windows')
        def buildToolsDir = "${androidComponents.sdkComponents.sdkDirectory.get().asFile.absolutePath}/build-tools/${android.buildToolsVersion}"
        apksignerPath = "${buildToolsDir}/apksigner${isWindows ? '.bat' : ''}"
        zipAlignPath = "${buildToolsDir}/zipalign${isWindows ? '.exe' : ''}"
        ignoreResources = ["R.id.*", "R.bool.*", "R.layout.unused_layout"]
    }
}

def cleanBuildDirTask = tasks.register('cleanBuildDirTask') {
    doFirst {
        logger.lifecycle 'Clean app build dir before assemble'
        layout.buildDirectory.get().asFile.deleteDir()
    }
}
tasks.configureEach {
    if (name == 'assembleDebug' || name == 'assembleRelease') {
        dependsOn cleanBuildDirTask
    }
}
