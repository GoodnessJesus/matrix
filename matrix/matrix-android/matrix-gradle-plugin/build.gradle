import org.jetbrains.kotlin.gradle.dsl.JvmTarget

apply plugin: 'java'
apply plugin: 'kotlin'

// AGP 9 requires JVM 17, so this module (which compiles against AGP) must target 17 as well.
// Keeping both targets explicit also prevents compileJava from inheriting the daemon JDK
// version while compileKotlin caps at the highest target Kotlin supports.
java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

kotlin {
    compilerOptions {
        jvmTarget = JvmTarget.JVM_17
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    compileOnly gradleApi()
    compileOnly 'com.android.tools.build:gradle:9.4.1'
    implementation project(':matrix-commons')
    implementation 'org.ow2.asm:asm:9.8'
    implementation 'org.ow2.asm:asm-commons:9.8'
    implementation 'org.ow2.asm:asm-util:9.8'
    implementation project(':matrix-arscutil')
    implementation 'com.google.code.gson:gson:2.8.9'
    implementation "org.jetbrains.kotlin:kotlin-stdlib:${gradle.KOTLIN_VERSION}"
}

version = rootProject.ext.VERSION_NAME
group = rootProject.ext.GROUP

if("External" == rootProject.ext.PUBLISH_CHANNEL) {
    apply from: rootProject.file('gradle/java-publish.gradle')
}
else {
    apply from: rootProject.file('gradle/WeChatPublish.gradle')
    wechatPublish {
        artifactId = POM_ARTIFACT_ID
    }
}