// OSS_ANDROID_TEMPLATE_FILE_HEADER
/**
 * New android-publish gradle script
 *
 * 1. Multiple flavors support.
 * 2. Provide RELEASE_REPOSITORY_URL and SNAPSHOT_REPOSITORY_URL with gradle.properties or local.properties.
 * 3. Provide REPOSITORY_USERNAME and REPOSITORY_PASSWORD if needed.
 */
apply plugin: 'maven-publish'
apply plugin: 'signing'

android.publishing {
    multipleVariants {
        allVariants()
    }
}

def isReleaseBuild() {
    return version.contains("SNAPSHOT") == false
}

def getReleaseRepositoryUrl() {
    return hasProperty('RELEASE_REPOSITORY_URL') ? RELEASE_REPOSITORY_URL : readPropertyFromLocalProperties('RELEASE_REPOSITORY_URL')
}

def getSnapshotRepositoryUrl() {
    return hasProperty('SNAPSHOT_REPOSITORY_URL') ? SNAPSHOT_REPOSITORY_URL : readPropertyFromLocalProperties('SNAPSHOT_REPOSITORY_URL')
}

def readPropertyFromLocalProperties(String key) {
    Properties properties = new Properties()
    try {
        properties.load(project.rootProject.file('local.properties').newDataInputStream())
    } catch (Exception e) {
        println("load local properties failed msg:${e.message}")
    }
    return properties.getProperty(key)
}

def getRepositoryUsername() {
    return hasProperty('REPOSITORY_USERNAME') ? REPOSITORY_USERNAME : readPropertyFromLocalProperties('REPOSITORY_USERNAME')
}

def getRepositoryPassword() {
    return hasProperty('REPOSITORY_PASSWORD') ? REPOSITORY_PASSWORD : readPropertyFromLocalProperties('REPOSITORY_PASSWORD')
}

def pomConfig = {
    scm {
        url rootProject.ext.POM_SCM_URL
        tag rootProject.ext.POM_SCM_COMMIT
    }

    licenses {
        license {
            name rootProject.ext.POM_LICENCE_NAME
            url rootProject.ext.POM_LICENCE_URL
            distribution rootProject.ext.POM_LICENCE_DIST
        }
    }

    developers {
        developer {
            id rootProject.ext.POM_DEVELOPER_ID
            name rootProject.ext.POM_DEVELOPER_NAME
        }
    }

    name rootProject.ext.POM_NAME
    url rootProject.ext.POM_URL
}

androidComponents.onVariants(androidComponents.selector()) { variant ->
    if (variant.buildType == "debug") {
        return
    }

    def variantName = variant.name
    def cVariantName = variantName.capitalize()
    def hasFlavors = variant.flavorName != null && !variant.flavorName.isEmpty()

    def artifactIdSuffix = hasFlavors ? variant.flavorName.replace('_', '-').capitalize() : ''
    variant.productFlavors.each { flavorPair ->
        def flavor = android.productFlavors.getByName(flavorPair.second)
        def flavorArtifactIdSuffix = flavor.ext.has('artifactIdSuffix') ? flavor.ext.artifactIdSuffix : flavor.name
        if (!flavorArtifactIdSuffix.isEmpty()) {
            artifactIdSuffix = artifactIdSuffix.replace(flavor.name.capitalize(), "-${flavorArtifactIdSuffix}")
        } else {
            artifactIdSuffix = artifactIdSuffix.replace(flavor.name.capitalize(), "")
        }
    }
    if (!artifactIdSuffix.isEmpty() && !artifactIdSuffix.startsWith('-')) {
        artifactIdSuffix = '-' + artifactIdSuffix
    }

    def curArtifactId = "${POM_ARTIFACT_ID}${artifactIdSuffix}"

    def javadoc = task("${variantName}Javadoc", type: Javadoc) {
        source = variant.sources.java.all
        options.encoding = 'utf-8'
        destinationDir = project.layout.buildDirectory.dir("docs/javadoc/${variantName}").get().asFile
        classpath = files(androidComponents.sdkComponents.bootClasspath) + variant.compileClasspath
        exclude '**/BuildConfig.java'
        exclude '**/R.java'
        failOnError = false
    }
    def javadocJar = task("${variantName}JavadocJar", type: Jar, dependsOn: javadoc) {
        archiveClassifier = 'javadoc'
        destinationDirectory = project.layout.buildDirectory.dir("libs/${variantName}")
        from javadoc.destinationDir
    }
    def sourcesJar = task("${variantName}SourcesJar", type: Jar) {
        archiveClassifier = 'sources'
        destinationDirectory = project.layout.buildDirectory.dir("libs/${variantName}")
        from variant.sources.java.all
        from variant.sources.kotlin.all
    }

    def buildTypeName = variant.buildType.capitalize()
    def nativeBuildTaskPrefixes = [
            "buildCMake${buildTypeName}",
            "buildNdkBuild${buildTypeName}"
    ]
    if (variant.buildType == 'release') {
        nativeBuildTaskPrefixes.add('buildCMakeRelWithDebInfo')
    }
    def nativeBuildTasks = project.tasks.matching { nativeTask ->
        nativeTask.hasProperty('soFolder') && nativeBuildTaskPrefixes.any {
            nativeTask.name.startsWith("${it}[")
        }
    }
    def jniSymbolsJar = null
    if (variant.externalNativeBuild != null) {
        jniSymbolsJar = task("${variantName}SymbolJar", type: Jar, dependsOn: nativeBuildTasks) {
            archiveClassifier = "so-symbols"
            destinationDirectory = project.layout.buildDirectory.dir("libs/${variantName}")
            nativeBuildTasks.all { nativeTask ->
                from(nativeTask.soFolder) {
                    into nativeTask.soFolder.map { it.asFile.name }
                    include '**/*.so'
                    include '**/*.a'
                }
            }
        }
    }

    def publicationName = "component${cVariantName}"

    publishing.publications {
        "$publicationName"(MavenPublication) {
            artifactId = curArtifactId
            groupId = project.group
            version = project.version

            from project.components.findByName(variantName)

            artifact sourcesJar
            artifact javadocJar
            if (jniSymbolsJar) {
                artifact jniSymbolsJar
            }

            pom.withXml {
                asNode().children().last() + pomConfig
                asNode().appendNode('description', rootProject.ext.POM_DESCRIPTION)
            }
        }
    }
}

if (project.hasProperty("signing.keyId")) {
    signing {
        publishing.publications.all { publication ->
            sign publication
        }
    }
} else {
    println "[W] No signing configurations."
}

/**
 * Setup custom maven repo
 */
publishing.repositories {
    maven {
        url = "${isReleaseBuild() ? getReleaseRepositoryUrl() : getSnapshotRepositoryUrl()}"
        credentials {
            username = "${getRepositoryUsername()}"
            password = "${getRepositoryPassword()}"
        }
    }
}

if (JavaVersion.current().isJava8Compatible()) {
    allprojects {
        tasks.withType(Javadoc) {
            options.addStringOption('Xdoclint:none', '-quiet')
        }
    }
}

task buildAndPublishToLocalMaven(type: Copy, dependsOn: ['publishToMavenLocal']) {
    group = 'publishing'

    // save artifacts files to artifacts folder
    from configurations.archives.allArtifacts.files
    into rootProject.layout.buildDirectory.dir("outputs/artifacts/")
    rename { String fileName ->
        fileName.replace("release.aar", "${version}.aar")
    }

    doLast {
        println "* published to maven local: ${project.group}:${project.name}:${project.version}"
    }
}

task buildAndPublishRepo(type: Copy, dependsOn: ['publish']) {
    group = "publishing"

    // save artifacts files to artifacts folder
    from configurations.archives.allArtifacts.files
    into rootProject.layout.buildDirectory.dir("outputs/artifacts/")
    rename { String fileName ->
        fileName.replace("release.aar", "${version}.aar")
    }

    doLast {
        println "* published to repo: ${project.group}:${project.name}:${project.version}"
    }
}

apply from: rootProject.file('gradle/check.gradle')