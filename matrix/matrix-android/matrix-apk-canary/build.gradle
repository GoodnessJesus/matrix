apply plugin: 'java'

java {
    sourceCompatibility = rootProject.ext.javaVersion
    targetCompatibility = rootProject.ext.javaVersion
}

version = rootProject.ext.VERSION_NAME
group = rootProject.ext.GROUP

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation 'com.google.code.gson:gson:2.8.9'
    implementation project(':matrix-commons')
    implementation 'com.android.tools:common:25.1.0'
}

jar {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    manifest {
        attributes 'Main-Class': 'com.tencent.matrix.apk.ApkChecker'
        attributes 'Manifest-Version': version
    }
    from {
        exclude 'META-INF/MANIFEST.MF'
        exclude 'META-INF/*.SF'
        exclude 'META-INF/*.DSA'
        exclude 'META-INF/*.RSA'
        configurations.runtimeClasspath.files.collect { it.isDirectory() ? it : zipTree(it) }
    }
}

// copy the jar to work directory
tasks.register('buildApkCheckJar', Copy) {
    dependsOn build, jar
    group = "matrix"
    from('build/libs') {
        include '*.jar'
        exclude '*-javadoc.jar'
        exclude '*-sources.jar'
    }
    into(project.file("tools_output"))
}

if("External" == rootProject.ext.PUBLISH_CHANNEL) {
    apply from: rootProject.file('gradle/java-publish.gradle')
}else {
    //uploading to WeChat maven repo
    apply from: rootProject.file('gradle/WeChatPublish.gradle')
    wechatPublish {
        artifactId = POM_ARTIFACT_ID
    }
}

